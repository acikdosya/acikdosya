# Sunucudaki calisma duzeni.
#
# Kenar vekil BU DOSYADA DEGIL: makine paylasimli ve 80/443 bize ait olmayan
# bir system-nginx'te. Konteyner yalnizca loopback'e yayin yapiyor, nginx
# vhost'u (deploy/nginx/acikdosya.org.conf) ona vekillik ediyor ve sertifikayi
# certbot aliyor.
#
# Port ve kurulum dizini burada yazili degil: depo public, o degerler
# .env.deploy ve deploy/RUNBOOK.md icinde durur. deploy.sh sunucuya APP_PORT
# tasiyan bir .env birakir, compose onu buradan okur.
#
# Imaj burada derlenmiyor — scripts/deploy.sh yerelde derleyip aktariyor.

services:
  app:
    image: acikdosya:latest
    container_name: acikdosya-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Yalnizca loopback: port disariya acik degil, nginx disinda kimse
    # dogrudan erisemez.
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT tanimli degil — sunucudaki .env dosyasina yazilir}:3000"
    # Bu makinede baska uretim servisleri var; uygulama onlarin bellegini
    # yemesin.
    mem_limit: 512m
    # Olcum yigini ayri bir compose dosyasinda (deploy/analytics). Uygulama
    # ona yalnizca bu paylasilan ag uzerinden, /veri yeniden yazimiyla
    # ulasiyor; Umami'nin disariya acik portu yok.
    #
    # Ag yoksa "docker compose up" hata verir; scripts/deploy.sh eksikse
    # olusturuyor. Olcum yigini hic kurulmamis olsa da uygulama ayakta
    # kalir — o durumda /veri altina istek de gitmez, cunku website id
    # gomulu degilse script hic basilmaz.
    # Harita paketi imajin icinde DEGIL. 66 MB'lik arsiv her dagitimda ssh
    # uzerinden yeniden gitmesin diye sunucuda duruyor ve buraya baglaniyor;
    # scripts/deploy.sh yalnizca degistiginde gonderiyor. Salt okunur.
    volumes:
      - ./tiles:/app/public/tiles:ro
    networks:
      - acikdosya-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  acikdosya-net:
    external: true
