# acikdosya.org — paylasimli sunucudaki system-nginx vhost'u.
# Bu makinede nginx 80 ve 443'u tutuyor ve 15 site sunuyor; Caddy koymak
# hepsinin onundeki vekili devirmek olurdu. Diger sitelerle ayni desen.
#
# Kurulum (bir kez):
#   scp deploy/nginx/acikdosya.org.conf root@46.62.206.100:/etc/nginx/sites-available/
#   ssh root@46.62.206.100 'ln -sf /etc/nginx/sites-available/acikdosya.org.conf /etc/nginx/sites-enabled/'
#   ssh root@46.62.206.100 'nginx -t && systemctl reload nginx'
#   ssh root@46.62.206.100 'certbot --nginx -d acikdosya.org -d www.acikdosya.org'
#
# certbot calismadan once iki ad da A kaydiyla sunucuya bakmali. Ikisi de
# bakiyor (dogrulandi 10.09.2026); bakmasaydi o ad icin dogrulama duser ve
# sertifika hic verilmezdi.
#
# certbot calistiktan sonra bu blok :443 sunucusu olur, certbot ayri bir :80
# blogu ekleyip HTTPS'e yonlendirir. Asagidaki add_header satirlari :443
# blogunda kalir — HSTS zaten yalnizca HTTPS uzerinde anlamli.

server {
    server_name acikdosya.org www.acikdosya.org;

    # Sayfalar kucuk, hicbir yerde yukleme yok.
    client_max_body_size 1m;

    # Tek kanonik adres. nginx'te server baglaminda "if" genelde kacinilan
    # bir yapidir; istisnasi tam olarak budur: yalnizca return yapan bir if
    # guvenlidir ve certbot'un tek blokla calisan desenini bozmaz.
    if ($host = www.acikdosya.org) {
        return 308 https://acikdosya.org$request_uri;
    }

    # Uygulama konteyneri compose.yaml ile 127.0.0.1'e yayin yapiyor;
    # portu disariya acik degil, yalnizca nginx erisiyor.
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Bir yil boyunca yalnizca HTTPS. preload YOK: preload listesine girmek
    # geri alinmasi aylar suren bir taahhut, bilincli bir karar olmadan
    # yazilmaz. always: hata sayfalarinda da gonderilsin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/acikdosya.org.access.log;
    error_log  /var/log/nginx/acikdosya.org.error.log;

    listen 80;
    listen [::]:80;
}
